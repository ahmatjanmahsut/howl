<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Howl · 外观工坊</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--bg2:#111318;--panel:#141821;--panel2:#191c23;--line:rgba(255,255,255,.1);
--txt:rgba(255,255,255,.9);--dim:rgba(255,255,255,.6);--dim2:rgba(255,255,255,.45);
--acc:#4d8aff;--acc2:#5f97ff;--accText:#a8cfff;--ok:#43d17c;--bad:#ff6b6b;--gold:#e8b93a;
--panelBg:rgba(20,24,40,.72);--shadow:0 12px 32px -12px rgba(0,0,0,.45);--r:16px}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 520px at 82% -10%,#17202e 0%,var(--bg) 55%) no-repeat,var(--bg);color:var(--txt);
font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow-x:hidden}
a{color:var(--acc);cursor:pointer;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:8px 12px;transition:.15s}
button:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.07)}
button.primary{background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:transparent;color:#08131f;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:rgba(255,107,107,.35)}
button.mini{padding:4px 9px;font-size:12px;border-radius:9px}
input,select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px 11px;outline:none;transition:.15s}
input:focus,select:focus{border-color:rgba(77,138,255,.6);box-shadow:0 0 0 3px rgba(77,138,255,.14)}
.hidden{display:none!important}
/* ===== 顶栏(sticky 75px + 玻璃 + 底部渐变线) ===== */
header{position:sticky;top:0;z-index:50;height:75px;display:flex;align-items:center;gap:12px;padding:0 18px;
background:rgba(18,20,32,.78);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid transparent;
}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.18) 50%,transparent 100%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px;font-size:17px}
.brand svg{width:26px;height:26px;filter:drop-shadow(0 0 10px rgba(77,138,255,.7))}
.brand b{background:linear-gradient(90deg,#fff,var(--accText));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;margin-left:8px}
nav a{padding:8px 14px;border-radius:12px;color:rgba(255,255,255,.5);font-weight:600;position:relative}
nav a:hover{background:rgba(255,255,255,.04);color:#fff}
nav a.on{color:var(--acc);background:linear-gradient(90deg,rgba(77,138,255,.14),rgba(77,138,255,.04))}
nav a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);height:18px;width:3px;border-radius:0 3px 3px 0;background:var(--acc);box-shadow:0 0 16px rgba(77,138,255,.75)}
.spacer{flex:1}
.who{color:var(--dim);font-size:13px;max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1440px;margin:0 auto;padding:8px 20px 80px}
/* ===== 页头(eyebrow + 大标题 + 水印) ===== */
.pagehead{position:relative;padding:22px 4px 10px;overflow:hidden}
.pagehead .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:700}
.pagehead h1{margin:4px 0 6px;font-size:28px;display:flex;align-items:center;gap:10px}
.pagehead h1 em{font-style:normal;color:var(--accText)}
.pagehead .desc{color:var(--dim);font-size:13.5px;max-width:640px}
.pagehead .wm{position:absolute;right:6px;top:2px;font-size:64px;font-weight:900;color:rgba(255,255,255,.045);letter-spacing:.06em;pointer-events:none;user-select:none}
section{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;margin:0 0 12px}
.sec-h svg{width:19px;height:19px;color:var(--accText)}
.hint{color:var(--dim2);font-size:12.5px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--line)}
/* ===== 服务器状态卡 ===== */
.srvbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:10px 0 4px}
.srvcard{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),rgba(20,24,40,.72);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(10px)}
.srvcard.up{border-color:rgba(77,138,255,.35)}
.srvhd{display:flex;align-items:center;gap:8px}
.srvdot{width:9px;height:9px;border-radius:50%;background:#6b7280;flex:none}
.srvcard.up .srvdot{background:#43d17c;box-shadow:0 0 0 3px rgba(67,209,124,.18)}
.srvname{font-weight:700;font-size:15px}
.srvstate{margin-left:auto;font-size:12px;color:var(--dim2)}
.srvcard.up .srvstate{color:#43d17c}
.srvmeta{display:flex;gap:16px;flex-wrap:wrap}
.srvkv{display:flex;flex-direction:column;gap:2px}
.srvkv b{font-size:15px}
.srvkv span{font-size:11px;color:var(--dim2)}
.srvaddr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:rgba(255,255,255,.5);background:rgba(0,0,0,.25);border-radius:8px;padding:5px 9px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srvjoin{display:flex;gap:8px}
.srvjoin a{flex:1;text-align:center;padding:9px 12px;border-radius:12px;font-weight:700;font-size:13px;background:linear-gradient(180deg,#5f97ff,#4d8aff);color:#08131f}
.srvjoin a.off{background:rgba(255,255,255,.06);color:var(--dim2);pointer-events:none;border:1px solid var(--line)}
.srvmini{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:9px 12px;font-size:12px;cursor:pointer}
.srvload{color:var(--dim2);font-size:12px;padding:10px 2px}
/* ===== 背包行 ===== */
.loadoutrow{display:flex;flex-direction:column;gap:14px}
@media(min-width:1100px){.loadoutrow{flex-direction:row;align-items:flex-end}.bagcol{flex:1;min-width:0}.summary{width:336px;flex:none}}
.bag{position:relative;width:224px;flex:none;border:1px solid rgba(77,138,255,.6);background:rgba(77,138,255,.06);border-radius:16px;padding:12px;cursor:pointer}
.bag .wmnum{position:absolute;right:10px;top:4px;font-size:40px;font-weight:900;color:rgba(255,255,255,.05)}
.bag .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;place-content:center;padding:10px 4px}
.bag .cellimg{height:44px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden}
.bag .cellimg img{max-width:100%;max-height:42px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.bag .morecap{font-size:11px;color:var(--dim2);text-align:center}
.bagname{font-weight:700;font-size:13px}
.inuse{position:absolute;left:10px;top:10px;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.5);color:var(--accText);backdrop-filter:blur(4px)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumcard{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02);border-radius:16px;padding:8px;cursor:pointer;transition:.15s;text-align:center}
.sumcard:hover{border-color:rgba(77,138,255,.45);background:rgba(77,138,255,.06)}
.sumcard .im{height:86px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);border-radius:12px;overflow:hidden}
.sumcard .im img{max-width:100%;max-height:82px;object-fit:contain}
.sumcard .lb{font-size:11px;color:rgba(255,255,255,.45);margin-top:6px}
.sumcard .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== 武器平铺网格(2→7 列响应式) ===== */
.itemgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.itemgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.itemgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){.itemgrid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1280px){.itemgrid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1536px){.itemgrid{grid-template-columns:repeat(7,1fr)}}
.scard{position:relative;display:flex;flex-direction:column;aspect-ratio:5/6;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;cursor:pointer;overflow:hidden;
background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));transition:transform .15s,border-color .15s,box-shadow .15s}
.scard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0px,rgba(255,255,255,.035) 1px,transparent 1px,transparent 6px);opacity:.6;pointer-events:none}
.scard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rc,transparent);opacity:.8;pointer-events:none}
.scard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.25);box-shadow:0 12px 28px -12px rgba(0,0,0,.65)}
.scard.on{border-color:rgba(77,138,255,.6);background:rgba(77,138,255,.1)}
.scard .glow{position:absolute;left:0;right:0;bottom:0;height:66%;background:radial-gradient(ellipse 90% 100% at 50% 100%,var(--rc2,transparent),transparent 70%);pointer-events:none}
.scard .imgwrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.scard .imgwrap img{max-height:80%;max-width:74%;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(0,0,0,.55));transition:.18s;opacity:0}
.scard .imgwrap img.loaded{opacity:1}
.scard:hover .imgwrap img{transform:translateY(-2px) scale(1.08)}
.scard .t1{font-size:14px;font-weight:700;color:rgba(255,255,255,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .t2{display:flex;align-items:center;gap:5px;font-size:10.5px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden}
.scard .t2 i{width:9px;height:9px;border-radius:2px;flex:none;background:var(--rc)}
.scard .t3{font-size:9.5px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .badge{position:absolute;right:6px;top:6px;display:flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.75);backdrop-filter:blur(4px)}
.scard .badge.ct{color:#9cc7ff}.scard .badge.t{color:#ffd479}
.scard .stk{position:absolute;left:5px;top:5px;display:flex;gap:2px}
.scard .stk img{height:18px;width:22px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.scard .kc{position:absolute;left:5px;top:26px}
.scard .kc img{height:18px;object-fit:contain}
.scard .ops{position:absolute;right:6px;bottom:44px;display:flex;flex-direction:column;gap:5px;opacity:0;transition:.15s}
.scard:hover .ops{opacity:1}
.scard .ops button{padding:3px 7px;font-size:10.5px;border-radius:8px;background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.skel{position:absolute;inset:0;background:linear-gradient(90deg,#141821 25%,#1c2230 37%,#141821 63%);background-size:400% 100%;animation:sk 1.2s ease-in-out infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
/* ===== 工具条 ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.searchwrap{position:relative;flex:1;min-width:150px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:rgba(255,255,255,.4);pointer-events:none}
.searchwrap input{width:100%;padding-left:32px}
.savestate{font-size:12px;color:var(--dim2);margin-left:auto}
.savestate.dirty{color:var(--gold)}
/* ===== 弹层(居中 + 左 360 + 右滑出翼) ===== */
.ovl{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
.ovl .mask{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.modal{position:relative;display:flex;flex-direction:column;max-height:92vh;width:min(96vw,780px);overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.12);background:#111318;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .18s ease-out}
@media(min-width:768px){.modal{flex-direction:row}}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
.mleft{width:100%;flex:none;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:768px){.mleft{width:360px;max-width:calc(100vw - 24px)}}
.mleftscroll{overflow-y:auto;padding:14px;min-height:0;flex:1}
.grip{width:40px;height:6px;border-radius:999px;background:rgba(255,255,255,.15);margin:0 auto 10px}
.mtitle{font-size:13px;font-weight:600;text-align:center;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px;position:relative}
.mclose{position:absolute;right:12px;top:10px;width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:rgba(255,255,255,.5);font-size:15px}
.mclose:hover{background:rgba(255,255,255,.1);color:#fff}
.mprev{margin-top:12px;position:relative;height:160px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);padding:14px;overflow:hidden}
.mprev img{max-height:140px;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.mprev .badge{position:absolute;right:10px;top:10px;font-size:11px;padding:2px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.75)}
.mskinname{margin-top:9px;text-align:center;font-size:12px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msync{margin-top:11px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);border-radius:12px;padding:6px 10px;font-size:11px;color:rgba(255,255,255,.45)}
.mtabs{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.mtab{display:flex;min-height:52px;width:100%;align-items:center;gap:12px;border-radius:16px;border:1px solid rgba(255,255,255,.1);padding:8px 12px;cursor:pointer;background:rgba(255,255,255,.02);text-align:left;transition:.15s}
.mtab:hover{border-color:rgba(255,255,255,.25)}
.mtab.on{border-color:rgba(77,138,255,.6);background:rgba(77,138,255,.1)}
.mtab .ic{width:17px;height:17px;color:rgba(255,255,255,.5);flex:none}
.mtab.on .ic{color:var(--accText)}
.mtab .lb{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.mtab .hint2{margin-left:auto;font-size:11px;color:rgba(255,255,255,.45);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtab .pv{width:40px;height:26px;object-fit:contain;margin-left:auto}
.mprops{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);border-radius:16px;padding:11px;margin-top:10px;display:flex;flex-direction:column;gap:9px}
.prow{display:flex;min-height:44px;align-items:center;justify-content:space-between;gap:12px}
.prow .lbl{font-size:13px;color:rgba(255,255,255,.6);flex:none;display:flex;align-items:center;gap:7px}
.prow .lbl i{width:11px;height:11px;border-radius:50%}
.prow input[type=number]{width:104px;padding:6px 8px;font-size:12.5px}
.prow input[type=text]{flex:1;min-width:0;padding:6px 8px;font-size:12.5px}
.prow .wz{display:flex;align-items:center;gap:8px}
.mwing{position:relative;width:100%;flex:1;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0}
@media(max-width:767px){.mwing{border-left:0;border-top:1px solid rgba(255,255,255,.08);max-height:70vh}}
.whead{display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.08);padding:10px 12px}
.whead h4{margin:0;flex:1;min-width:0;font-size:13px;font-weight:600;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wback{width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:rgba(255,255,255,.5)}
.wback:hover{background:rgba(255,255,255,.1);color:#fff}
.wbody{overflow-y:auto;padding:14px;min-height:0;flex:1}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:768px){.wgrid{grid-template-columns:repeat(4,1fr)}}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden;border-radius:12px;border:1px solid rgba(255,255,255,.1);padding:8px;cursor:pointer;background:rgba(255,255,255,.02);transition:.14s}
.pick:hover{border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
.pick.on{border-color:rgba(77,138,255,.6);background:rgba(77,138,255,.1)}
.pick .im{width:100%;height:62px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pick .im img{max-height:60px;max-width:100%;object-fit:contain;opacity:0;transition:.2s}
.pick .im img.loaded{opacity:1}
.pick .nm{width:100%;text-align:center;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .en{width:100%;text-align:center;font-size:9.5px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .rt{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--rc)}
.loadmore{grid-column:1/-1;text-align:center;padding:12px}
/* 贴纸槽 */
.slotsrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.slotb{flex:1;display:flex;flex-direction:column;align-items:center;border-radius:12px;border:1px solid rgba(255,255,255,.1);padding:6px 4px;cursor:pointer;background:rgba(255,255,255,.02)}
.slotb.on{border-color:rgba(77,138,255,.6);background:rgba(77,138,255,.1)}
.slotb img{height:28px;object-fit:contain}
.slotb span{font-size:10px;color:rgba(255,255,255,.5)}
.numrows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12px;color:var(--dim);cursor:pointer;font-weight:600}
.chip:hover{color:#fff}
.chip.on{color:var(--acc);border-color:rgba(77,138,255,.45);background:rgba(77,138,255,.1)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mixbtn{display:block;width:100%;margin-bottom:12px;border:0;background:transparent;color:var(--accText);text-align:left;font-weight:600;padding:6px 2px}
.mixbtn:hover{color:#fff}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:21px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.18s;border:0;cursor:pointer;margin:0}
.switch input:checked{background:var(--acc)}
.switch input::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s}
.switch input:checked::after{transform:translateX(17px)}
/* ===== 其它页 ===== */
.card{background:rgba(20,24,40,.72);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;backdrop-filter:blur(10px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:600;font-size:12px}
tr:hover td{background:rgba(255,255,255,.03)}
.adtag{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;color:var(--dim);margin-right:6px}

<a href="#/me" data-v="me">账号</a>

<template id="t-login">
  <div class="card" style="max-width:430px;margin:48px auto">
    <div class="row" style="margin-bottom:14px"><button class="ghost" id="tabLogin">登录</button><button class="ghost" id="tabReg">注册</button></div>

      <input name="username" placeholder="用户名" autocomplete="username">
      <input name="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="primary" style="padding:11px">登 录</button>
    </form>

    <form id="fBind" class="row" style="margin-top:8px">
      <input name="code" maxlength="6" placeholder="绑定码" style="width:130px;text-transform:uppercase;letter-spacing:2px;text-align:center">
      <button class="primary">绑定</button>
    </form>
  </div>
  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px">修改密码</h2>
    <form id="fPass" style="display:flex;flex-direction:column;gap:10px;max-width:340px">
      <input name="old" type="password" placeholder="当前密码" autocomplete="current-password">
      <input name="nw" type="password" placeholder="新密码(≥8 位)" autocomplete="new-password">
      <input name="nw2" type="password" placeholder="重复新密码" autocomplete="new-password">
      <button class="primary">保存新密码</button>
    </form>
  </div>
</template>

<template id="t-admin">
  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px">用户管理</h2>
    <div class="row">
      <input id="adq" placeholder="搜索 用户名 / 邮箱 / SteamID" style="width:min(300px,60vw)">
      <button id="adGo">搜索</button>
      <span class="spacer"></span><span id="adCount" style="color:var(--dim)"></span>
    </div>
    <div id="adBody" style="overflow:auto;margin-top:12px"></div>
  </div>
</template>
<script src="app.js?v=15"></script>
</body>
</html>
